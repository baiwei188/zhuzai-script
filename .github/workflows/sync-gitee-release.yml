name: Sync exe to gitee release
on:
  push:
    branches: [main]
    paths: ['主宰世界脚本.exe']
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exe to gitee release v_latest
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: python3 .github/scripts/sync_gitee_release.py

name: Sync assets to gitee release
on:
  push:
    branches: [main]
    paths: ['主宰世界脚本.exe']
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync to gitee release v_latest
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          _retry() { local n=$1 d="$2"; shift 2; local i=0; until "$@"; do i=$((i+1)); if [ "$i" -ge "$n" ]; then echo "重试$i/$n仍失败:$d"; return 1; fi; echo "失败($d) 30秒后重试($i/$n)..."; sleep 30; done; }
          _retry 2 "sync_gitee_release.py" python3 .github/scripts/sync_gitee_release.py
